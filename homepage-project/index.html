<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homepage</title>
  <link rel="stylesheet" href="styles/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <img src="assets/profile.jpg" alt="Profile Photo" class="profile-img" />
    <h1>Lucas</h1>
    <p>Front-End Developer | HTML, CSS, JavaScript</p>
    <nav class="socials">
      <a href="#"><img src="assets/github.svg" alt="GitHub"/></a>
      <a href="#"><img src="assets/linkedin.svg" alt="LinkedIn"/></a>
      <a href="#"><img src="assets/twitter.svg" alt="Twitter"/></a>
    </nav>
  </header>

  <main>
    <section class="projects">
      <h2>Projects</h2>
      <div class="project-card">
        <h3>Project 1</h3>
        <p>A cool front-end project.</p>
        <a href="#"><img src="assets/link.svg" alt="View Project"/></a>
      </div>
    </section>

    <section class="contact">
      <h2>Contact</h2>
      <p><img src="assets/email.svg" alt="Email Icon"/> lucas@example.com</p>
      <p><img src="assets/phone.svg" alt="Phone Icon"/> (123) 456-7890</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Lucas</p>
  </footer>

</body>
</html>
